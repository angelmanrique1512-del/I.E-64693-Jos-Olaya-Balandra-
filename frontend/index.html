<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia Docente</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="background-overlay"></div>

<div class="topbar">
  <div class="title-business">
    <img src="js/logo.png" class="logo">
    <span>I.E. José Olaya Balandra</span>
  </div>

  <button class="hamburger">
    <i class="fa-solid fa-bars"></i>
  </button>
</div>

<aside class="sidebar">
  <div class="sidebar-logo">MENÚ</div>

<ul>
  <li>
    <a href="#" onclick="mostrarHistorial()">
      <i class="fa-solid fa-house"></i> Inicio
    </a>
  </li>

  <li>
    <a href="#" onclick="cargarDocentes()">
      <i class="fa-solid fa-users"></i> Lista de docentes
    </a>
  </li>
</ul>
</aside>

<main>
  <div class="main-content">

    <div class="card registro-card">
      <h4>Registrar Asistencia</h4>
      <div class="d-flex gap-2">
        <input type="text" id="dni" class="form-control" placeholder="Ingrese DNI">
        <button class="btn btn-primary" onclick="registrar()">Registrar</button>
      </div>
      <p id="mensaje"></p>
    </div>

    <div class="card" id="historial">
  <h4>Historial</h4>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-dark">
            <tr>
              <th>DNI</th>
              <th>Nombre</th>
              <th>Curso</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-asistencia"></tbody>
        </table>
      </div>
    </div>
   
    <div id="lista-docentes" style="display:none;">
  <h4>Lista de Docentes</h4>

  <table class="table">
    <thead>
      <tr>
        <th>DNI</th>
        <th>Nombre</th>
        <th>Apellidos</th>
        <th>Curso</th>
      </tr>
    </thead>

    <tbody id="tabla-docentes"></tbody>
  </table>
</div>

  </div>
</main>

<script src="js/main.js"></script>
<script src="js/sidebar.js"></script>

</body>
</html>
